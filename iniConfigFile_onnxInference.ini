; ============================================================================
; textile_inference_gpu - configuration
;
; Paths should NOT be enclosed in quotes (GetString does not remove them, 
; except for Model/Path where stripping is explicit).
; Integers are read with base 0: a leading zero means OCTAL.
; ============================================================================

[Model]
Path="D:\EMANUELE\textile_inference_gpu\models\ssn_res18_layer1-2_declr2.5e-5_seglr2.5e-5_adaptlr1.25e-5_patch5_perlin0.6_noisestd0.0075_gamma0.4.onnx"
; 17 patches per chunk: must match [Patches] Count
BatchSize=17
; 1 = 17 executions of batch size 1 (PatchCore: the memory bank doesn't fit in 
; VRAM with a full batch). 0 = a single execution of batch size 17.
LoopBatch1=0
WarmupRuns=100

[Hardware]
; 0 = CPU (not supported by the pipeline), 1 = CUDA, 2 = TensorRT
Provider=2
DeviceId=0
EnableFP16=1
TrtWorkspaceMB=2048
TrtBuilderOptLevel=5
; Must be the SAME folder for all sessions: the first one compiles the
; engine, the others reload it instead of recompiling it.
TrtEngineCachePath=trt_engine_cache
TrtTimingCachePath=trt_timing_cache

[Source]
; Geometry of the shared strip. The product of StripWidth*StripHeight*Channels
; must match sfc::FULL_PAYLOAD in SharedFrameContract.h, otherwise startup
; fails outputting both numbers in the error message.
StripWidth=512
StripHeight=8192
Channels=3

[Patches]
Count=17
PatchHeight=512
Overlap=32
; derived stride = PatchHeight - Overlap = 480
; constraint: (Count-1)*stride + PatchHeight == StripHeight

[Pipeline]
RawFrames=5
QueueRawCapacity=5
QueuePrepCapacity=5
QueueInfCapacity=5
; 0 = calculated from the minimum (PrepThreads + QueuePrep + InferenceThreads +
; QueueInf + PostThreads). Recommended to leave at 0.
Slots=0
PrepThreads=1
InferenceThreads=1
PostThreads=1
; WARNING: (PrepThreads + PostThreads) * OpenCvThreads are MULTIPLIED.
; These are two alternative ways to parallelize the 17 patches, they do not add up.
; 0 = OpenCV runs sequentially inside each stage thread (recommended: its pool threads
; would not inherit the stage priority and would compete with the stage threads).
OpenCvThreads=0
ReadTimeoutMs=100

[Output]
; 1 = map at the native model resolution (faster, no resize)
; 0 = resized back to PatchHeight x StripWidth
MapAtModelResolution=1
; Requires pixel_threshold_raw in the model metadata
DrawMask=0

[Preprocessing]
; Used only when the model input is half the patch size (e.g. 512 -> 256).
; MUST match the resize used at training time:
;   1 = triangle filter (PIL / torchvision Resize with antialias=True);
;       bit-exact with the old AntialiasResizer
;   0 = 2x2 average; bit-exact with cv::resize INTER_LINEAR (what blobFromImages did)
ResizeAntialias=1

[RealTime]
; REALTIME_PRIORITY_CLASS if the process holds SeIncreaseBasePriorityPrivilege
; (run as administrator), otherwise HIGH_PRIORITY_CLASS. Also opts out of power throttling.
ElevateProcess=1
; Per-stage thread priority, as THREAD_PRIORITY_* levels:
;   15 = TIME_CRITICAL, 2 = HIGHEST, 1 = ABOVE_NORMAL, 0 = NORMAL,
;   -1 = BELOW_NORMAL, -2 = LOWEST, -15 = IDLE
; Base priority under REALTIME class: 31 / 26 / 25 / 24 / 23 / 22 / 16
; (under HIGH class: 15 / 15 / 14 / 13 / 12 / 11 / 1).
; The ORDER is what matters: ingest frees the producer buffer as soon as a frame is
; signaled; inference keeps the GPU fed; prep and post do bulk CPU work and must not
; delay the first two. Giving every stage 15 makes them round-robin among themselves.
IngestPriority=15
InferencePriority=2
PrepPriority=1
PostPriority=0

[Logger]
; The startup config dump is one multi-line record: at 480 it was truncated.
maxMessageChars=1024
queueCapacity=4096
flushIntervalMs=200
notifyThreshold=1024

[Metrics]
WindowDimension=200