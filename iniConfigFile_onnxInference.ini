; ============================================================================
; textile_inference_gpu - configuration
;
; Paths should NOT be enclosed in quotes (GetString does not remove them, 
; except for Model/Path where stripping is explicit).
; Integers are read with base 0: a leading zero means OCTAL.
; ============================================================================

[Model]
Path=C:\models\anomaly.onnx
; 17 patches per chunk: must match [Patches] Count
BatchSize=17
; 1 = 17 executions of batch size 1 (PatchCore: the memory bank doesn't fit in 
; VRAM with a full batch). 0 = a single execution of batch size 17.
LoopBatch1=0
WarmupRuns=10

[Hardware]
; 0 = CPU (not supported by the pipeline), 1 = CUDA, 2 = TensorRT
Provider=2
DeviceId=0
EnableFP16=1
TrtWorkspaceMB=2048
TrtBuilderOptLevel=3
; Must be the SAME folder for all sessions: the first one compiles the
; engine, the others reload it instead of recompiling it.
TrtEngineCachePath=trt_engine_cache
TrtTimingCachePath=trt_timing_cache

[Source]
; Geometry of the shared strip. The product of StripWidth*StripHeight*Channels
; must match sfc::FULL_PAYLOAD in SharedFrameContract.h, otherwise startup
; fails outputting both numbers in the error message.
StripWidth=8192
StripHeight=512
Channels=3

[Patches]
Count=17
PatchHeight=512
Overlap=32
; derived stride = PatchHeight - Overlap = 480
; constraint: (Count-1)*stride + PatchHeight == StripHeight

[Pipeline]
RawFrames=3
QueueRawCapacity=4
QueuePrepCapacity=4
QueueInfCapacity=4
; 0 = calculated from the minimum (PrepThreads + QueuePrep + InferenceThreads +
; QueueInf + PostThreads). Recommended to leave at 0.
Slots=0
PrepThreads=1
InferenceThreads=1
PostThreads=1
; WARNING: (PrepThreads + PostThreads) * OpenCvThreads are MULTIPLIED.
; These are two alternative ways to parallelize the 17 patches, they do not add up.
OpenCvThreads=4
ReadTimeoutMs=100

[Output]
; 1 = map at the native model resolution (faster, no resize)
; 0 = resized back to PatchHeight x StripWidth
MapAtModelResolution=1
; Requires pixel_threshold_raw in the model metadata
DrawMask=0

[RealTime]
ElevateProcess=1
PrepRealtime=1
InferenceRealtime=1
PostRealtime=0

[Logger]
maxMessageChars=480
queueCapacity=4096
flushIntervalMs=200
notifyThreshold=1024

[Metrics]
WindowDimension=100
; 0 = no periodic printing
PrintEveryMs=2000